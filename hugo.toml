baseURL = "https://dsu-digital-sound-design.github.io/f-26-creative-coding/"
languageCode = "en-us"
title = "Creative Coding"
enableRobotsTXT = true

# Console only. This class runs off the interactive etude pages rather than
# slide decks, so reveal-hugo is not installed and no page sets `outputs`.
theme = ["t-console-theme"]

[params]
  accent = "#ffc85c"
  description = "Explore music, sound, and visuals with code through weekly experiments, creative studies, and an ensemble or independent project."

  [params.course]
    code = "CSC 274"
    title = "Creative Coding"
    term = "Fall 2026"
    meeting = "Mondays, 1:00–1:50 p.m."
    instructor = "Tate Carson"
    final = "December 14, 1:00–3:00 p.m. Check D2L for arrangements."

  [params.schedule]
    # Semester week 1 begins August 24; the first meeting was August 31.
    start = "2026-08-24"
    filterPlaceholder = 'Filter by keyword, such as "etude" or "due"'

    # Overrides the theme's default tag vocabulary (must restate all tags).
    # `slides` is gone; this class has etudes instead.
    [[params.schedule.tags]]
      id = "etude"
      label = "Etudes"
      color = "#6ec1ff"
    [[params.schedule.tags]]
      id = "project"
      label = "Projects"
      color = "#b6ff5c"
    [[params.schedule.tags]]
      id = "due"
      label = "Due"
      color = "#ff7a5c"
    [[params.schedule.tags]]
      id = "lab"
      label = "Labs"
      color = "#ffc85c"
    [[params.schedule.tags]]
      id = "off"
      label = "No class"
      color = "#7d8a7a"
      skip = true

  [[params.facts]]
    key = "Meets"
    value = "Mondays, 1:00–1:50 p.m."
  [[params.facts]]
    key = "Room"
    value = "See D2L"
  [[params.facts]]
    key = "Instructor"
    value = "Tate Carson"
  [[params.facts]]
    key = "Tools"
    value = "Laptop, current browser, wired headphones"
  [[params.facts]]
    key = "Cost"
    value = "No textbook required"

[[menus.main]]
  name = "schedule"
  pageRef = "/schedule"
  weight = 10
[[menus.main]]
  name = "etudes"
  pageRef = "/etudes"
  weight = 20
[[menus.main]]
  name = "projects"
  pageRef = "/projects"
  weight = 30
[[menus.main]]
  name = "syllabus"
  pageRef = "/syllabus"
  weight = 40

[[menus.main]]
  name = "tools"
  pageRef = "/resources"
  weight = 50

[markup.goldmark.renderer]
  # Etude pages embed the Strudel REPL web component.
  unsafe = true

[markup.tableOfContents]
  ordered = false
  startLevel = 1
  endLevel = 2
